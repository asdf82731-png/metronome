<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7EAED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1114" media="(prefers-color-scheme: dark)">
<meta name="description" content="專業節拍器：細分節奏、人聲數拍、複節奏、速度與靜音訓練">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Metronome">
<title>Pro Metronome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
[hidden]{display:none!important}

/* Layout: one instrument panel column — pendulum, tempo dial, beat strip, then settings drawers */
:root{
  --bg:#E7EAED; --panel:#F6F7F8; --ink:#13171C; --muted:#5B6570; --line:#CBD2D8;
  --accent:#0A6B6B; --accent-ink:#FFFFFF; --down:#C9721F; --poly:#6A4FB3; --off:#D9DEE3;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1114; --panel:#161A1F; --ink:#E6EAEE; --muted:#8B96A1; --line:#29313A;
  --accent:#3DB5AA; --accent-ink:#06201E; --down:#F09A45; --poly:#A48BEB; --off:#222930; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1114; --panel:#161A1F; --ink:#E6EAEE; --muted:#8B96A1; --line:#29313A;
  --accent:#3DB5AA; --accent-ink:#06201E; --down:#F09A45; --poly:#A48BEB; --off:#222930; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:18px 40px}
.wrap{max-width:540px;margin:0 auto;display:grid;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
/* pendulum */
.pend{position:relative;height:120px;overflow:hidden}
.pend svg{position:absolute;inset:0;width:100%;height:100%}
.needle{position:absolute;left:50%;bottom:6px;width:3px;height:104px;margin-left:-1.5px;background:var(--ink);border-radius:2px;transform-origin:50% 100%;transform:rotate(-26deg)}
.needle::after{content:"";position:absolute;left:50%;top:22px;width:16px;height:12px;margin-left:-8px;background:var(--accent);border-radius:2px}
.pivot{position:absolute;left:50%;bottom:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ink)}
/* tempo */
.tempo{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-top:6px}
.bpm{text-align:center;font-family:var(--display);font-weight:800;font-size:96px;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bpm small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.2em;color:var(--muted);margin-top:6px}
.nudge{display:grid;gap:6px}
.nudge button{width:52px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--mono);font-size:14px}
.nudge button:active{background:var(--off)}
.marking{text-align:center;font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:.08em;margin-top:8px}
.marking span{font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:0;margin-left:6px}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:12px}
/* beats */
.beatwrap{transition:opacity .15s}
.beatwrap.muted{opacity:.35}
.beats{display:flex;gap:6px;align-items:flex-end;height:100px}
.beat{flex:1;min-width:0;height:100%;border:0;background:none;padding:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.bar{width:100%;border-radius:6px;background:var(--off);transition:background .06s}
.beat[data-l="3"] .bar{height:72px} .beat[data-l="2"] .bar{height:48px}
.beat[data-l="0"] .bar{height:6px;background:transparent;border:1px dashed var(--line)}
.beat.on .bar{background:var(--accent)} .beat.on[data-l="3"] .bar{background:var(--down)}
.pips{display:flex;gap:2px;justify-content:center;height:6px}
.pip{flex:0 1 6px;height:6px;border-radius:3px;background:var(--off)}
.pip.rest{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.pip.on{background:var(--ink)} .pip.rest.on{box-shadow:inset 0 0 0 1px var(--ink);background:transparent}
.num{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
.polyrow{position:relative;height:18px;margin-top:10px;border-top:1px dashed var(--line)}
.polyrow i{position:absolute;top:6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--off)}
.polyrow i.on{background:var(--poly)}
/* transport */
.transport{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.go{height:64px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.1em;text-transform:uppercase}
.go.running{background:var(--ink);color:var(--bg)}
.tap{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.1em}
.tap:active{background:var(--off)}
.stats{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:13px;color:var(--muted);padding-inline:4px;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
/* settings */
.row{display:grid;gap:8px}
.row + .row{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-width:44px;height:38px;padding-inline:12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-family:var(--mono);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sig{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.step button{width:38px;height:38px;border:0;background:none;font-size:18px}
.step output{min-width:30px;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.vol{display:flex;align-items:center;gap:10px}.vol input{margin:0}
.vol output{font-family:var(--mono);font-size:13px;min-width:38px;text-align:right}
/* subdivision grid */
.pats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pat{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 8px 8px;display:grid;gap:7px;min-width:0}
.pat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--panel)}
.rgrid{display:flex;gap:3px;height:16px}
.rgrid span{border-radius:3px;background:var(--ink)}
.rgrid span.r{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.pat[aria-pressed="true"] .rgrid span:not(.r){background:var(--accent)}
.pat em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* toggle sections */
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch h2{margin:0;font-size:16px;font-weight:600}
.switch p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tog{width:52px;height:30px;border-radius:15px;border:0;background:var(--off);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tog[aria-checked="true"]{background:var(--accent)}.tog[aria-checked="true"]::after{transform:translateX(22px)}
.body{margin-top:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fld{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.fld input,.txt{width:100%;box-sizing:border-box;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:15px;text-align:center}
.ratio{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ratio b{font-family:var(--display);font-weight:800;font-size:34px;color:var(--poly);font-variant-numeric:tabular-nums}
.prog{margin-top:12px;height:6px;border-radius:3px;background:var(--off);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
/* presets */
.saverow{display:flex;gap:8px;margin-top:12px}
.saverow .txt{text-align:left;padding-inline:12px;font-family:var(--body);min-width:0;flex:1}
.btn{height:38px;padding-inline:16px;border-radius:9px;border:0;background:var(--ink);color:var(--bg);font-weight:600;flex:none}
.plist{display:grid;gap:6px;margin-top:10px}
.pwrap{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pwrap.cur{border-color:var(--accent)}
.pitem{display:flex;align-items:center;gap:8px;padding-left:12px}
.pitem .load{flex:1;min-width:0;text-align:left;border:0;background:none;padding:9px 0;display:flex;justify-content:space-between;gap:10px}
.pitem .load span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .load small{font-family:var(--mono);color:var(--muted);flex:none}
.pitem .del{border:0;background:none;width:40px;height:40px;color:var(--muted);font-size:18px}
.pedit{display:grid;gap:8px;padding:0 12px 12px}
.pedit .erow{display:grid;grid-template-columns:1fr 92px;gap:8px}
.pedit .txt{text-align:left;padding-inline:10px;font-family:var(--body)}
.eacts{display:flex;gap:6px}
.eacts button{height:38px;min-width:44px;padding-inline:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.eacts .grow{flex:1;white-space:nowrap}
.eacts button:disabled{opacity:.35}
.eacts .danger{color:var(--down)}
.empty{font-size:13px;color:var(--muted);margin:10px 0 0}
.keys{font-size:12px;color:var(--muted);text-align:center}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
@media (max-width:420px){.bpm{font-size:80px}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.pat{padding:9px 6px 7px}}
@media (prefers-reduced-motion:reduce){.bar,.tog::after,.prog i,.beatwrap{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">Pro Metronome</div>
    <div class="meta"><span id="sigLabel">4/4</span> · <span id="subLabel">四分</span><span id="polyLabel"></span></div>
  </header>

  <section class="panel" aria-label="速度">
    <div class="pend" aria-hidden="true">
      <svg viewBox="0 0 300 120" preserveAspectRatio="xMidYMax meet" id="scale"></svg>
      <div class="needle" id="needle"></div><div class="pivot"></div>
    </div>
    <div class="tempo">
      <div class="nudge"><button id="m5" aria-label="減 5 BPM">−5</button><button id="m1" aria-label="減 1 BPM">−1</button></div>
      <div class="bpm"><span id="bpmVal">120</span><small>BPM</small></div>
      <div class="nudge"><button id="p5" aria-label="加 5 BPM">+5</button><button id="p1" aria-label="加 1 BPM">+1</button></div>
    </div>
    <div class="marking" id="marking">Allegro<span>快板</span></div>
    <input type="range" id="bpmRange" min="20" max="300" value="120" aria-label="BPM">
  </section>

  <section class="panel beatwrap" id="beatwrap" aria-label="拍子強弱">
    <div class="beats" id="beats"></div>
    <div class="polyrow" id="polyrow" hidden></div>
  </section>

  <div class="transport">
    <button class="go" id="go">開始</button>
    <button class="tap" id="tap">TAP</button>
  </div>

  <section class="panel">
    <div class="row">
      <div class="label">拍號</div>
      <div class="sig">
        <div class="step"><button id="bMinus" aria-label="減少拍數">−</button><output id="beatsOut">4</output><button id="bPlus" aria-label="增加拍數">+</button></div>
        <span style="font-family:var(--mono);color:var(--muted)">/</span>
        <div class="seg" id="denSeg"></div>
      </div>
      <div class="seg" id="presetSeg"></div>
    </div>
    <div class="row">
      <div class="label">細分節奏</div>
      <div class="pats" id="pats"></div>
    </div>
    <div class="row">
      <div class="label">音色</div>
      <div class="seg" id="kitSeg"></div>
    </div>
    <div class="row">
      <div class="label">音量</div>
      <div class="vol"><input type="range" id="vol" min="0" max="100" value="80" aria-label="音量"><output id="volOut">80%</output></div>
    </div>
  </section>

  <section class="panel">
    <div class="switch">
      <div><h2>複節奏 Polyrhythm</h2><p>在每小節內平均疊上另一組拍點</p></div>
      <button class="tog" id="polyTog" role="switch" aria-checked="false" aria-label="複節奏"></button>
    </div>
    <div class="body" id="polyBody" hidden>
      <div class="ratio">
        <div class="step"><button id="pyMinus" aria-label="減少">−</button><output id="pyOut">3</output><button id="pyPlus" aria-label="增加">+</button></div>
        <b id="ratioOut">3 : 4</b>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="switch">
      <div><h2>速度訓練</h2><p>每隔幾小節自動加速，直到目標速度</p></div>
      <button class="tog" id="trainTog" role="switch" aria-checked="false" aria-label="速度訓練"></button>
    </div>
    <div class="body" id="trainBody" hidden>
      <div class="grid4">
        <label class="fld">起始 BPM<input id="tStart" type="number" inputmode="numeric" value="80"></label>
        <label class="fld">目標 BPM<input id="tTarget" type="number" inputmode="numeric" value="120"></label>
        <label class="fld">每幾小節<input id="tBars" type="number" inputmode="numeric" value="4"></label>
        <label class="fld">每次加<input id="tStep" type="number" inputmode="numeric" value="2"></label>
      </div>
      <div class="prog"><i id="tProg"></i></div>
    </div>
  </section>

  <section class="panel">
    <div class="switch">
      <div><h2>靜音訓練</h2><p>響幾小節、靜幾小節，檢查自己的內在節奏</p></div>
      <button class="tog" id="gapTog" role="switch" aria-checked="false" aria-label="靜音訓練"></button>
    </div>
    <div class="body" id="gapBody" hidden>
      <div class="grid2">
        <label class="fld">發聲小節<input id="gPlay" type="number" inputmode="numeric" value="2"></label>
        <label class="fld">靜音小節<input id="gMute" type="number" inputmode="numeric" value="2"></label>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="switch"><div><h2>我的設定</h2><p>儲存速度、拍號、重音、細分等組合，一鍵切換。按 ✎ 可以改名、改速度、更新或調整順序</p></div></div>
    <form class="saverow" id="saveForm">
      <input class="txt" id="pName" maxlength="24" placeholder="例如：Blues shuffle 練習" aria-label="設定名稱">
      <button class="btn" type="submit">儲存</button>
    </form>
    <div class="plist" id="plist"></div>
  </section>


  <div class="keys"><kbd>Space</kbd> 開始/停止　<kbd>T</kbd> Tap　<kbd>↑</kbd><kbd>↓</kbd> ±1　<kbd>←</kbd><kbd>→</kbd> ±5</div>
  <div class="keys">版本 v9</div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const TERMS=[[40,'Grave','極緩板'],[60,'Largo','廣板'],[66,'Larghetto','小廣板'],[76,'Adagio','柔板'],[108,'Andante','行板'],[120,'Moderato','中板'],[156,'Allegro','快板'],[176,'Vivace','活潑的快板'],[200,'Presto','急板'],[999,'Prestissimo','最急板']];
const T3=1/3;
/* each step: [fraction of beat, sounds?] */
const PATS=[
 {k:'q', n:'四分',        s:[[1,1]]},
 {k:'e', n:'八分',        s:[[.5,1],[.5,1]]},
 {k:'eo',n:'反拍八分',    s:[[.5,0],[.5,1]]},
 {k:'t', n:'三連音',      s:[[T3,1],[T3,1],[T3,1]]},
 {k:'t1',n:'三連 首休',   s:[[T3,0],[T3,1],[T3,1]]},
 {k:'sw',n:'Shuffle',     s:[[T3,1],[T3,0],[T3,1]]},
 {k:'t3',n:'三連 尾休',   s:[[T3,1],[T3,1],[T3,0]]},
 {k:'s', n:'十六分',      s:[[.25,1],[.25,1],[.25,1],[.25,1]]},
 {k:'es',n:'八＋兩十六',  s:[[.5,1],[.25,1],[.25,1]]},
 {k:'se',n:'兩十六＋八',  s:[[.25,1],[.25,1],[.5,1]]},
 {k:'ds',n:'附點八＋十六',s:[[.75,1],[.25,1]]},

const KITS={voice:{n:'人聲 1e&a',voice:true},click:{n:'Click',w:'square',f:{3:2000,s:1100,p:2600},d:.025,v:.45},
            wood:{n:'木魚',w:'triangle',f:{3:1250,s:660,p:1700},d:.07,v:1},
            beep:{n:'Beep',w:'sine',f:{3:1760,s:990,p:2350},d:.09,v:.9},
            cow:{n:'牛鈴',w:'square',f:{3:800,s:540,p:1080},d:.12,v:.35}};
// 3 重音 (different timbre), 2 一般 (same sound as the subdivisions), 0 靜音 — all at the same volume
const LVLGAIN={3:.8,s:.8,p:.6};
const fixAccents=a=>a.map(l=>l===1?2:l);
const PRESETS=[[2,4],[3,4],[4,4],[5,4],[6,8],[7,8],[9,8],[12,8]];
const OLDSUB={'1':'q','2':'e','3':'t','4':'s','sw':'sw'};

const S={bpm:120,beats:4,den:4,pat:'q',kit:'wood',vol:80,accents:[3,2,2,2],
  trainer:false,tStart:80,tTarget:120,tBars:4,tStep:2,
  poly:false,polyN:3,gap:false,gPlay:2,gMute:2};
let saved=[];
try{const o=JSON.parse(localStorage.getItem('proMetronome')||'null');if(o){Object.assign(S,o);if(o.sub&&!o.pat)S.pat=OLDSUB[o.sub]||'q';delete S.sub;}}catch(e){}
try{saved=JSON.parse(localStorage.getItem('proMetronomeSets')||'[]')||[];}catch(e){saved=[];}
if(!PATS.some(p=>p.k===S.pat))S.pat='q';
function save(){try{localStorage.setItem('proMetronome',JSON.stringify(S));}catch(e){}}
function saveSets(){try{localStorage.setItem('proMetronomeSets',JSON.stringify(saved));}catch(e){}}

function defaultAccents(b,d){
  const a=Array(b).fill(2);a[0]=3;
  if(d===8&&b%3===0&&b>3){for(let i=3;i<b;i+=3)a[i]=3;}
  else if(b===5){a[3]=3;} else if(b===7){a[2]=3;a[4]=3;}
  return a;
}
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const PAT=()=>PATS.find(p=>p.k===S.pat);

/* ---------- UI ---------- */
function setBpm(v){S.bpm=clamp(Math.round(v),20,300);$('bpmVal').textContent=S.bpm;$('bpmRange').value=S.bpm;
  const t=TERMS.find(x=>S.bpm<x[0]);$('marking').innerHTML=t[1]+'<span>'+t[2]+'</span>';save();updateProg();}
function renderBeats(){
  const el=$('beats');el.innerHTML='';const st=PAT().s;
  S.accents.forEach((l,i)=>{const b=document.createElement('button');b.className='beat';b.dataset.l=l;
    b.setAttribute('aria-label','第 '+(i+1)+' 拍');
    b.innerHTML='<div class="bar"></div><div class="pips">'+st.map(x=>'<i class="pip'+(x[1]?'':' rest')+'"></i>').join('')+'</div><div class="num">'+(i+1)+'</div>';
    b.onclick=()=>{S.accents[i]={3:2,2:0,0:3}[S.accents[i]]??2;b.dataset.l=S.accents[i];save();};el.appendChild(b);});
  el.style.gap=S.beats>9?'3px':'6px';
  const pr=$('polyrow');pr.hidden=!S.poly;pr.innerHTML='';
  if(S.poly){for(let j=0;j<S.polyN;j++){const d=document.createElement('i');d.style.left='calc('+(j/S.polyN*100)+'% + 5px)';pr.appendChild(d);}}
}
function seg(id,items,cur,on){const el=$(id);el.innerHTML='';items.forEach(it=>{const b=document.createElement('button');
  b.textContent=it.t;b.setAttribute('aria-pressed',String(it.k===cur));b.onclick=()=>on(it.k);el.appendChild(b);});}
function renderPats(){const el=$('pats');el.innerHTML='';PATS.forEach(p=>{const b=document.createElement('button');b.className='pat';
  b.setAttribute('aria-pressed',String(p.k===S.pat));b.setAttribute('aria-label',p.n);
  b.innerHTML='<div class="rgrid">'+p.s.map(x=>'<span style="flex:'+x[0]+'" class="'+(x[1]?'':'r')+'"></span>').join('')+'</div><em>'+p.n+'</em>';
  b.onclick=()=>{S.pat=p.k;refresh();};el.appendChild(b);});}
function renderSettings(){
  $('beatsOut').textContent=S.beats;$('sigLabel').textContent=S.beats+'/'+S.den;
  $('subLabel').textContent=PAT().n;$('polyLabel').textContent=S.poly?' · '+S.polyN+':'+S.beats:'';
  seg('denSeg',[2,4,8,16].map(d=>({k:d,t:String(d)})),S.den,d=>{S.den=d;S.accents=defaultAccents(S.beats,d);refresh();});
  seg('presetSeg',PRESETS.map(p=>({k:p.join('/'),t:p.join('/')})),S.beats+'/'+S.den,k=>{const[b,d]=k.split('/').map(Number);
    S.beats=b;S.den=d;S.accents=defaultAccents(b,d);refresh();});
  renderPats();
  seg('kitSeg',['click','wood','beep','cow','voice'].map(k=>({k,t:KITS[k].n})),S.kit,k=>{S.kit=k;refresh();preview();});
  $('vol').value=S.vol;$('volOut').textContent=S.vol+'%';
  [['trainTog','trainBody','trainer'],['polyTog','polyBody','poly'],['gapTog','gapBody','gap']].forEach(([t,b,k])=>{
    $(t).setAttribute('aria-checked',String(S[k]));$(b).hidden=!S[k];});
  ['tStart','tTarget','tBars','tStep','gPlay','gMute'].forEach(k=>$(k).value=S[k]);
  $('pyOut').textContent=S.polyN;$('ratioOut').textContent=S.polyN+' : '+S.beats;
  renderList();
}
function refresh(){save();renderSettings();renderBeats();}

/* presets list */
function summary(p){return p.bpm+' · '+p.beats+'/'+p.den+' · '+(PATS.find(x=>x.k===p.pat)||PATS[0]).n;}
let editIdx=-1,curIdx=-1;
function loadSet(p){const keep=S.vol;Object.assign(S,JSON.parse(JSON.stringify(p.s)));S.vol=keep;
  if(!Array.isArray(S.accents)||S.accents.length!==S.beats)S.accents=defaultAccents(S.beats,S.den);S.accents=fixAccents(S.accents);refresh();setBpm(S.bpm);}
function snapshot(){const snap=JSON.parse(JSON.stringify(S));delete snap.vol;return snap;}
function renderList(){const el=$('plist');el.innerHTML='';
  if(editIdx>=saved.length)editIdx=-1;if(curIdx>=saved.length)curIdx=-1;
  if(!saved.length){el.innerHTML='<p class="empty">還沒有儲存的設定。調好之後輸入名稱按「儲存」。</p>';return;}
  saved.forEach((p,i)=>{const wrap=document.createElement('div');wrap.className='pwrap'+(i===curIdx?' cur':'');
    const row=document.createElement('div');row.className='pitem';
    const ld=document.createElement('button');ld.className='load';ld.innerHTML='<span></span><small></small>';
    ld.querySelector('span').textContent=p.name;ld.querySelector('small').textContent=summary(p.s);
    ld.onclick=()=>{loadSet(p);curIdx=i;renderList();};
    const ed=document.createElement('button');ed.className='del';ed.textContent=i===editIdx?'✓':'✎';
    ed.setAttribute('aria-label',(i===editIdx?'完成調整 ':'調整 ')+p.name);ed.setAttribute('aria-expanded',i===editIdx);
    ed.onclick=()=>{editIdx=i===editIdx?-1:i;renderList();};
    row.append(ld,ed);wrap.appendChild(row);if(i===editIdx)wrap.appendChild(editor(p,i));el.appendChild(wrap);});}
/* editor for one saved set: rename, change BPM, overwrite with current settings, reorder, delete */
function editor(p,i){const f=document.createElement('div');f.className='pedit';
  f.innerHTML='<div class="erow"><label class="fld">名稱<input class="txt" maxlength="24"></label>'+
    '<label class="fld">BPM<input type="number" inputmode="numeric" min="20" max="300"></label></div>'+
    '<div class="eacts"><button class="grow" data-a="upd">用目前設定更新</button>'+
    '<button data-a="up" aria-label="往上移">↑</button><button data-a="down" aria-label="往下移">↓</button>'+
    '<button class="danger" data-a="del">刪除</button></div>';
  const [nm,bp]=f.querySelectorAll('input');nm.value=p.name;bp.value=p.s.bpm;
  nm.onchange=()=>{const v=nm.value.trim();
    if(!v||saved.some((q,j)=>j!==i&&q.name===v)){nm.value=p.name;return;}
    p.name=v;saveSets();renderList();};
  bp.onchange=()=>{const v=Number(bp.value);if(!v){bp.value=p.s.bpm;return;}
    p.s.bpm=clamp(Math.round(v),20,300);if(i===curIdx)setBpm(p.s.bpm);saveSets();renderList();};
  const up=f.querySelector('[data-a="up"]'),dn=f.querySelector('[data-a="down"]');up.disabled=i===0;dn.disabled=i===saved.length-1;
  const move=d=>{const j=i+d;[saved[i],saved[j]]=[saved[j],saved[i]];
    if(curIdx===i)curIdx=j;else if(curIdx===j)curIdx=i;editIdx=j;saveSets();renderList();};
  up.onclick=()=>move(-1);dn.onclick=()=>move(1);
  f.querySelector('[data-a="upd"]').onclick=()=>{p.s=snapshot();curIdx=i;saveSets();renderList();};
  f.querySelector('[data-a="del"]').onclick=()=>{if(!confirm('刪除「'+p.name+'」？'))return;saved.splice(i,1);
    if(curIdx===i)curIdx=-1;else if(curIdx>i)curIdx--;editIdx=-1;saveSets();renderList();};
  return f;}
$('saveForm').addEventListener('submit',e=>{e.preventDefault();const name=$('pName').value.trim()||('設定 '+(saved.length+1));
  const snap=snapshot();
  const ex=saved.findIndex(p=>p.name===name);if(ex>=0)saved[ex].s=snap;else saved.push({name,s:snap});
  curIdx=ex>=0?ex:saved.length-1;
  $('pName').value='';saveSets();renderList();});

/* scale arcs for pendulum */
(function(){let s='';for(let a=-30;a<=30;a+=5){const r=a*Math.PI/180,x1=150+Math.sin(r)*100,y1=120-Math.cos(r)*100,
  len=a%15===0?12:6,x2=150+Math.sin(r)*(100+len),y2=120-Math.cos(r)*(100+len);
  s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--muted)" stroke-width="${a%15===0?2:1}"/>`;}
  $('scale').innerHTML=s;})();

/* ---------- Audio ---------- */
let ctx=null,master=null,running=false,timer=null,nextTime=0,beatIdx=0,bars=0,beatCount=0;
let queue=[],lastBeat={t:0,dur:.5,n:0},startedAt=0,elapsedPrev=0,wake=null;
/* iPhone: play through the silent switch like a music app */
try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
const BOOST=4,HOLD=.025,volGain=()=>BOOST*Math.pow(S.vol/100,1.6);
function ensureCtx(){
  if(ctx&&ctx.state==='closed'){ctx=null;voxBuf=null;}
  if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});master=ctx.createGain();
    /* loud but clean on phone speakers: boost, a limiter that only touches the loudest peaks,
       then a soft clipper (linear up to 0.7, bends toward 0.98) so the output stays below 0 dBFS */
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=0;comp.knee.value=0;comp.ratio.value=20;comp.attack.value=0;comp.release.value=.05;
    const half=ctx.createGain();half.gain.value=.5;const clip=ctx.createWaveShaper(),curve=new Float32Array(2048);
    for(let i=0;i<curve.length;i++){const x=(i/(curve.length-1)*2-1)*2,a=Math.abs(x);curve[i]=Math.sign(x)*(a<=.7?a:.7+.28*Math.tanh((a-.7)/.28));}
    clip.curve=curve;master.connect(comp).connect(half).connect(clip).connect(ctx.destination);}
  master.gain.value=volGain();
  if(ctx.state!=='running'){try{ctx.resume();}catch(e){}}
  // unlock: a silent 1-sample buffer started inside the tap
  try{const b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);}catch(e){}
  loadVox();}
/* unlock audio on the very first touch anywhere */
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,function once(){ensureCtx();document.removeEventListener(ev,once,true);},true));
/* voice counting: 1 e & a / 1 trip let / 1 la li & la li */
let voxBuf=null,voxLoading=false;
function loadVox(){if(voxBuf||voxLoading)return;voxLoading=true;const out={};
  Promise.all(Object.entries(VOX).map(([k,b64])=>new Promise(res=>{
    const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    try{ctx.decodeAudioData(u.buffer,b=>{out[k]=b;res();},()=>res());}catch(e){res();}
  }))).then(()=>{voxBuf=out;voxLoading=false;});}
function syl(pk,i,off,bi){
  if(i===0)return 'n'+(bi+1);
  if(pk==='x')return ['','la','li','and','la','li'][i];
  const near=v=>Math.abs(off-v)<.01;
  if(near(.25))return 'e';if(near(.5))return 'and';if(near(.75))return 'a';
  if(near(1/3))return 'trip';if(near(2/3))return 'let';return '';}
function say(name,t,gain,until){const b=voxBuf&&voxBuf[name];if(!b)return false;
  const src=ctx.createBufferSource(),g=ctx.createGain();src.buffer=b;g.gain.value=gain*1.4;
  src.connect(g).connect(master);src.start(t);
  if(until&&until>t){g.gain.setValueAtTime(gain*1.4,Math.max(t,until-.015));g.gain.linearRampToValueAtTime(0,until);src.stop(until+.01);}
  return true;}
function blip(level,t){const k=KITS[S.kit].voice?KITS.wood:KITS[S.kit];const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=level==='p'?'sine':k.w;o.frequency.setValueAtTime(k.f[level],t);
  if(k===KITS.wood)o.frequency.exponentialRampToValueAtTime(k.f[level]*.7,t+HOLD+k.d);
  const peak=(level==='p'?.9:k.v)*LVLGAIN[level],dec=level==='p'?.06:k.d;
  /* hold full level for HOLD before fading: far more energy per click, so it sounds louder at the same peak */
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.002);g.gain.setValueAtTime(peak,t+HOLD);
  g.gain.exponentialRampToValueAtTime(.0001,t+HOLD+dec);o.connect(g).connect(master);o.start(t);o.stop(t+HOLD+dec+.02);
  if(level===3){const o2=ctx.createOscillator(),g2=ctx.createGain();o2.type='sine';o2.frequency.setValueAtTime(k.f[3]*2,t);
    g2.gain.setValueAtTime(.0001,t);g2.gain.exponentialRampToValueAtTime(peak*.6,t+.002);g2.gain.exponentialRampToValueAtTime(.0001,t+.05);
    o2.connect(g2).connect(master);o2.start(t);o2.stop(t+.07);}}
function preview(){ensureCtx();if(S.kit==='voice'){const go=()=>say('n1',ctx.currentTime+.02,1);voxBuf?go():setTimeout(go,300);}else blip(3,ctx.currentTime+.02);}
const gapMuted=b=>S.gap&&(b%(S.gPlay+S.gMute))>=S.gPlay;
function schedule(){
  let added=false;
  while(nextTime<ctx.currentTime+.12){
    added=true;
    const D=60/S.bpm,bi=beatIdx,lvl=S.accents[bi]??2,mute=gapMuted(bars);let off=0;
    const pat=PAT(),voice=S.kit==='voice'&&voxBuf;
    pat.s.forEach(([f,p],i)=>{const t=nextTime+off*D;
      if(p&&!mute&&lvl>0){
        if(voice){let j=i+1;while(j<pat.s.length&&!pat.s[j][1])j++;
          const until=nextTime+(j<pat.s.length?pat.s.slice(0,j).reduce((a,x)=>a+x[0],0):1)*D;
          const acc=i===0&&lvl===3;if(!say(syl(pat.k,i,off,bi),t,.8,until))blip(acc?3:'s',t);else if(acc)blip(3,t);}
        else blip(i===0&&lvl===3?3:'s',t);}
      queue.push({t,bi,sub:i,beat:i===0,dur:D,bar:bars,mute});off+=f;});
    if(bi===0&&S.poly){const barD=D*S.beats;for(let j=0;j<S.polyN;j++){const t=nextTime+barD*j/S.polyN;
      if(!mute)blip('p',t);queue.push({t,poly:j});}}
    nextTime+=D;beatIdx++;
    if(beatIdx>=S.beats){beatIdx=0;bars++;
      if(S.trainer&&bars%Math.max(1,S.tBars)===0&&S.bpm<S.tTarget){const nb=Math.min(S.tTarget,S.bpm+Math.max(1,S.tStep));queue.push({t:nextTime,setBpm:nb});S.bpm=nb;}}
  }
  if(added)queue.sort((a,b)=>a.t-b.t);
}
function start(){ensureCtx();running=true;beatIdx=0;bars=0;queue=[];
  if(S.trainer)setBpm(S.tStart);
  const kick=()=>{nextTime=ctx.currentTime+.06;schedule();clearInterval(timer);timer=setInterval(schedule,25);};
  if(ctx.state==='running')kick();
  else{const p=ctx.resume();(p&&p.then?p:Promise.resolve()).then(()=>{if(running)kick();});
    setTimeout(()=>{if(running&&ctx.state!=='running'){ctx.close().catch(()=>{});ctx=null;ensureCtx();kick();}},600);}
  startedAt=performance.now();$('go').textContent='停止';$('go').classList.add('running');
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});}catch(e){}
  requestAnimationFrame(draw);}
function stop(){running=false;clearInterval(timer);elapsedPrev+=performance.now()-startedAt;queue=[];
  $('go').textContent='開始';$('go').classList.remove('running');$('beatwrap').classList.remove('muted');
  document.querySelectorAll('.beat.on,.pip.on,.polyrow i.on').forEach(e=>e.classList.remove('on'));
  try{wake&&wake.release();}catch(e){}wake=null;}
function draw(){
  if(!running)return;const now=ctx.currentTime;
  while(queue.length&&queue[0].t<=now){const q=queue.shift();
    if(q.setBpm){setBpm(q.setBpm);continue;}
    if(q.poly!==undefined){const dots=$('polyrow').children;
      [...dots].forEach(d=>d.classList.remove('on'));dots[q.poly]&&dots[q.poly].classList.add('on');continue;}
    const cells=$('beats').children;
    if(q.beat){document.querySelectorAll('.beat.on').forEach(e=>e.classList.remove('on'));
      cells[q.bi]&&cells[q.bi].classList.add('on');lastBeat={t:q.t,dur:q.dur,n:beatCount++};
      $('beatwrap').classList.toggle('muted',q.mute);}
    document.querySelectorAll('.pip.on').forEach(e=>e.classList.remove('on'));
    const pip=cells[q.bi]&&cells[q.bi].querySelectorAll('.pip')[q.sub];pip&&pip.classList.add('on');}
  const ph=clamp((now-lastBeat.t)/lastBeat.dur,0,1);
  $('needle').style.transform='rotate('+(26*Math.cos(Math.PI*(lastBeat.n+ph))).toFixed(2)+'deg)';
  requestAnimationFrame(draw);}
function toggle(){running?stop():start();}

/* tap tempo */
let taps=[];function tap(){const t=performance.now();if(taps.length&&t-taps[taps.length-1]>2000)taps=[];taps.push(t);if(taps.length>6)taps.shift();
  if(taps.length>1){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);setBpm(60000/iv);}
  const b=$('tap');b.style.background='var(--off)';setTimeout(()=>b.style.background='',90);}

function updateProg(){const span=S.tTarget-S.tStart;$('tProg').style.width=(span>0?clamp((S.bpm-S.tStart)/span,0,1)*100:0)+'%';}

/* wiring */
$('go').onclick=toggle;$('tap').onclick=tap;
[['m5',-5],['m1',-1],['p1',1],['p5',5]].forEach(([id,d])=>$(id).onclick=()=>setBpm(S.bpm+d));
$('bpmRange').oninput=e=>setBpm(+e.target.value);
$('bMinus').onclick=()=>{if(S.beats>1){S.beats--;S.accents=defaultAccents(S.beats,S.den);refresh();}};
$('bPlus').onclick=()=>{if(S.beats<16){S.beats++;S.accents=defaultAccents(S.beats,S.den);refresh();}};
$('pyMinus').onclick=()=>{if(S.polyN>2){S.polyN--;refresh();}};
$('pyPlus').onclick=()=>{if(S.polyN<16){S.polyN++;refresh();}};
$('vol').oninput=e=>{S.vol=+e.target.value;$('volOut').textContent=S.vol+'%';if(master)master.gain.value=volGain();save();};
$('trainTog').onclick=()=>{S.trainer=!S.trainer;refresh();updateProg();};
$('polyTog').onclick=()=>{S.poly=!S.poly;refresh();};
$('gapTog').onclick=()=>{S.gap=!S.gap;refresh();if(!S.gap)$('beatwrap').classList.remove('muted');};
const LIM={tStart:[20,300],tTarget:[20,300],tBars:[1,64],tStep:[1,40],gPlay:[1,32],gMute:[1,32]};
Object.keys(LIM).forEach(k=>$(k).onchange=e=>{const lim=LIM[k];
  S[k]=clamp(Math.round(+e.target.value)||lim[0],lim[0],lim[1]);e.target.value=S[k];save();updateProg();});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  if(e.code==='Space'){e.preventDefault();toggle();}else if(e.key==='t'||e.key==='T')tap();
  else if(e.key==='ArrowUp'){e.preventDefault();setBpm(S.bpm+1);}else if(e.key==='ArrowDown'){e.preventDefault();setBpm(S.bpm-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();setBpm(S.bpm+5);}else if(e.key==='ArrowLeft'){e.preventDefault();setBpm(S.bpm-5);}});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&ctx&&ctx.state!=='running'){try{ctx.resume();}catch(e){}
    if(running){setTimeout(()=>{if(ctx.state==='running'){nextTime=ctx.currentTime+.06;queue=[];}},50);}}if(running&&document.visibilityState==='visible'&&navigator.wakeLock&&!wake){navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});}});

if(!Array.isArray(S.accents)||S.accents.length!==S.beats)S.accents=defaultAccents(S.beats,S.den);
S.accents=fixAccents(S.accents);
renderSettings();renderBeats();setBpm(S.bpm);
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
